<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>Spieleabend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="player">
    <div class="topbar" id="topbar"></div>
    <div id="view" style="display:flex;flex-direction:column;gap:14px">
      <div class="card big-state"><div class="spinner"></div><p class="muted">Verbinde …</p></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/common.js"></script>
  <script>
    const session = JSON.parse(localStorage.getItem('spieleabend.player') || 'null');
    const view = $('#view');
    let ended = false;
    let state = null;
    if (!session || !session.playerId) location.href = '/';

    bindPlayerInputs(view);

    function end(title, text) {
      ended = true;
      localStorage.removeItem('spieleabend.player');
      setHTML(view, `<div class="card big-state"><div class="t">${esc(title)}</div><p class="muted">${esc(text)}</p>
        <a class="btn primary block" href="/">Zur Startseite</a></div>`);
      socket.disconnect();
    }

    socket.on('connect', () => {
      if (ended) return;
      socket.emit('player:join', session, (res) => {
        if (!res.ok) end('Raum nicht gefunden', res.error);
      });
    });
    socket.on('disconnect', () => {
      if (!ended) setHTML(view, waitingHTML('Verbindung verloren …', 'Wir verbinden dich automatisch neu.'));
    });
    socket.on('kicked', ({ reason }) => end('Tschüss', reason));
    socket.on('room:closed', () => end('Der Spieleabend ist vorbei', 'Der Host hat den Raum geschlossen.'));

    socket.on('state', (s) => {
      state = s;
      syncTime(s);
      const P = playerMap(s);
      const me = P[s.me.id];
      if (!me) return;
      setHTML($('#topbar'), `${av(me, 36)}<span class="nm">${esc(me.name)}</span>${s.gameId && s.gameId !== 'duemmste' ? `<span class="pill">${fmt(me.score)}</span>` : ''}${s.spicy ? '<span class="spicy-tag">SPICY</span>' : ''}`);

      if (!s.game) {
        setHTML(view, `
          <div class="card center">
            ${av(me, 96)}
            <h2 style="margin-top:12px">Du bist drin</h2>
            <p class="muted">Raum <b>${esc(s.code)}</b> · Gleich geht's los.</p>
            <div class="row" style="justify-content:center">
              <label class="btn sm" for="photo">${me.photo ? 'Foto ändern' : 'Foto hinzufügen'}</label>
              <button class="btn sm ghost" id="rename">Name ändern</button>
            </div>
            <input type="file" id="photo" accept="image/*" capture="user" class="hidden">
          </div>
          <div class="card"><div class="label" style="margin-bottom:10px">Dabei (${s.players.length})</div>
            <div class="lobby-faces" style="margin:0">${s.players.map((p) => `<div class="lobby-face" style="${p.connected ? '' : 'opacity:.35'}">${av(p, 48)}<span style="font-size:.85rem">${esc(p.name)}</span></div>`).join('')}</div>
          </div>
          <p class="center"><button class="btn sm ghost danger" id="leave">Raum verlassen</button></p>`);
        return;
      }
      setHTML(view, renderPlayer(s));
    });

    view.addEventListener('click', (e) => {
      if (e.target.id === 'leave' && confirm('Willst du den Raum wirklich verlassen?')) {
        socket.emit('player:leave', null, () => end('Du hast den Raum verlassen', 'Bis zum nächsten Mal!'));
      }
      if (e.target.id === 'rename') {
        const n = prompt('Neuer Name:', playerMap(state)[state.me.id]?.name || '');
        if (n) socket.emit('profile:update', { name: n }, (res) => res.ok ? (session.name = n.trim(), localStorage.setItem('spieleabend.player', JSON.stringify(session))) : alert(res.error));
      }
    });
    view.addEventListener('change', async (e) => {
      if (e.target.id !== 'photo' || !e.target.files[0]) return;
      const photo = await readPhoto(e.target.files[0]);
      try { localStorage.setItem('spieleabend.photo', photo); } catch (err) {}
      socket.emit('profile:update', { photo }, (res) => !res.ok && alert(res.error));
    });
  </script>
</body>
</html>
