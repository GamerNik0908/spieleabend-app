<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spieleabend – Bildschirm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="screen">
    <main id="main"><div class="spinner"></div></main>
    <footer id="footer"></footer>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/common.js"></script>
  <script>
    const code = (new URLSearchParams(location.search).get('code') || '').toUpperCase();
    let joinBase = location.origin;
    let lastState = null;

    fetch('/api/info').then((r) => r.json()).then((info) => {
      if (['localhost', '127.0.0.1', '::1'].includes(location.hostname) && info.lan.length) joinBase = info.lan[0];
      if (lastState) render(lastState);
    });

    socket.on('connect', () => {
      socket.emit('screen:join', { code }, (res) => {
        if (!res.ok) setHTML($('#main'), `<h1 class="center">Raum ${esc(code)} nicht gefunden</h1>`);
      });
    });
    socket.on('room:closed', () => setHTML($('#main'), '<h1 class="center">Danke fürs Mitspielen.</h1>'));
    socket.on('state', render);

    function render(s) {
      lastState = s;
      syncTime(s);
      checkBuzz(s);
      const url = `${joinBase}/?code=${s.code}`;
      const shortUrl = joinBase.replace(/^https?:\/\//, '');
      setHTML($('#footer'), `<span class="brand">SPIELEABEND</span><span>${esc(shortUrl)} · Code <b style="color:var(--accent)">${esc(s.code)}</b></span>`);
      if (!s.game) {
        setHTML($('#main'), `<div class="screen-lobby">
            <img src="/qr.svg?u=${encodeURIComponent(url)}" alt="QR-Code">
            <div>
              <div class="label">Scannen oder ${esc(shortUrl)} öffnen</div>
              <div class="room-code">${esc(s.code)}</div>
              ${s.spicy ? '<div class="spicy-tag" style="font-size:1.1rem;margin-top:8px">🌶️ SPICY-MODUS AN</div>' : ''}
              ${s.locked ? '<p class="muted">Lobby ist gesperrt</p>' : ''}
            </div>
          </div>
          <div class="lobby-faces">${s.players.map((p) => `<div class="lobby-face" style="${p.connected ? '' : 'opacity:.35'}">${av(p, 64)}<span>${esc(p.name)}</span></div>`).join('') || '<p class="muted">Warte auf Spieler …</p>'}</div>`);
        return;
      }
      setHTML($('#main'), renderStage(s));
    }
  </script>
</body>
</html>
